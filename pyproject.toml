[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SearchLibrium"
version = "0.1.0"
description = "Extensive hypothesis Testing for Latent Class Models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Zeke Ahern" },
    { name = "Mario Fernando Taco Morales" },
    { name = "Alexander Paz" },
    { name = "Prithvi Beeramole" },
    { name = "Robert Burdett" },
]
maintainers = [
    { name = "Zeke Ahern", email = "z.ahern@qut.edu.au" },
]
keywords = [
    "econometrics",
    "discrete choice",
    "choice modelling",
    "latent class",
    "logit",
    "mixed logit",
    "model specification search",
    "harmony search",
    "simulated annealing",
    "metaheuristics",
    "maximum likelihood",
    "transport modelling",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3.1",
    "jax[cuda12]>=0.4.30; sys_platform == 'linux'",
    "jax>=0.4.30; sys_platform != 'linux'",
    "jaxopt>=0.8.5",
    "addicty",
    "matplotlib",
    "pyfiglet",
    "colorama",
]

[project.urls]
Repository = "https://github.com/M-Fernando-Ing/Extensive-Hypothesis-Testing-for-Latent-Class-Models"

[tool.setuptools.packages.find]
where = ["src"]
include = ["SearchLibrium*"]
namespaces = false